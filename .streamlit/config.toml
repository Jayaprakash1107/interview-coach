# The stylesheet is written for a light ground. Declaring the theme here
# means the app does not depend on the viewer's Streamlit theme setting,
# and the CSS overrides become a backstop rather than the mechanism.
[theme]
base               = "light"
primaryColor       = "#16303F"
backgroundColor    = "#F6F7F4"
secondaryBackgroundColor = "#EDEFEA"
textColor          = "#16303F"
font               = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
